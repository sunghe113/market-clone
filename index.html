<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="info-bar">
        <div class="info-bar__time">20:55</div>
        <div class="info-bar__icons">
          <img src="assets/chart-bar.svg" alt="chart-bar" />
          <img src="assets/wi-fi.svg" alt="wi-fi" />
          <img src="assets/battery.svg" alt="battery" />
        </div>
      </div>
      <div class="menu-bar">
        <div class="menu-bar__location">
          <div>역삼1동</div>
          <div class="menu-bar__location-icon">
            <img src="assets/arow.svg" alt="arow" />
          </div>
        </div>
        <div class="menu-bar__icons">
          <img src="assets/search.svg" alt="search" />
          <img src="assets/menu.svg" alt="menu" />
          <img src="assets/alert.svg" alt="alert" />
        </div>
      </div>
    </header>

    <main>
      <div class="items-list">
        <div class="items-list__img">
          <img src="assets/image.svg" alt="" />
        </div>
        <div class="items-list__info">
          <div class="items-list__info-title">텐트 팝니다.</div>
          <div class="items-list__info-meta">정왕동 · 20초 전</div>
          <div class="items-list__info-price">100만원</div>
        </div>
      </div>
      <div class="items-list">
        <div class="items-list__img">
          <img src="assets/image.svg" alt="" />
        </div>
        <div class="items-list__info">
          <div class="items-list__info-title">화로대 팝니다.</div>
          <div class="items-list__info-meta">정왕동 · 30분 전</div>
          <div class="items-list__info-price">3만원</div>
        </div>
      </div>
      <div class="items-list">
        <div class="items-list__img">
          <img src="assets/image.svg" alt="" />
        </div>
        <div class="items-list__info">
          <div class="items-list__info-title">골제로 팝니다.</div>
          <div class="items-list__info-meta">정왕동 · 4시간 전</div>
          <div class="items-list__info-price">3만원</div>
        </div>
      </div>
      <div class="items-list">
        <div class="items-list__img">
          <img src="assets/image.svg" alt="" />
        </div>
        <div class="items-list__info">
          <div class="items-list__info-title">인디언행어 팝니다.</div>
          <div class="items-list__info-meta">정왕동 · 5일 전</div>
          <div class="items-list__info-price">3만원</div>
        </div>
      </div>
      <div class="items-list">
        <div class="items-list__img">
          <img src="assets/image.svg" alt="" />
        </div>
        <div class="items-list__info">
          <div class="items-list__info-title">롤테이블 팝니다.</div>
          <div class="items-list__info-meta">정왕동 · 7시간 전</div>
          <div class="items-list__info-price">3만원</div>
        </div>
      </div>
      <div class="items-list">
        <div class="items-list__img">
          <img src="assets/image.svg" alt="" />
        </div>
        <div class="items-list__info">
          <div class="items-list__info-title">캠핑의자 팝니다.</div>
          <div class="items-list__info-meta">정왕동 · 12시간 전</div>
          <div class="items-list__info-price">3만원</div>
        </div>
      </div>
      <div class="write-btn">+ 글쓰기</div>
    </main>

    <footer>
      <div class="footer-block">
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/home.svg" alt="" />
          </div>
          <div>홈</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/doc.svg" alt="" />
          </div>
          <div>동네생활</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/map.svg" alt="" />
          </div>
          <div>내 근처</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/chat.svg" alt="" />
          </div>
          <div>채팅</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/user.svg" alt="" />
          </div>
          <div>나의 당근</div>
        </div>
      </div>
    </footer>
    <div class="media-info-msg">화면을 줄여주세요!</div>
  </body>
</html>
